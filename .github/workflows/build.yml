name: Build Game EXE
on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame

      - name: Build EXE
        run: |
          pip install pyinstaller
          pyinstaller --onefile --windowed --name "Gunfighter" main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Gunfighter-Windows
          path: dist/Gunfighter.exe
